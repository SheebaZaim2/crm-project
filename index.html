<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divinenet CRM - Sprint 1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 25px 30px;
}

header h1 {
    margin: 0;
}

header p {
    margin: 8px 0 0;
}

nav {
    background: white;
    padding: 15px 30px;
    border-bottom: 1px solid #ddd;
}

button {
    padding: 10px 16px;
    margin: 5px 5px 5px 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

nav button {
    font-size: 15px;
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.hidden {
    display: none;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.card,
.campaign-card,
form,
.details-box {
    background: white;
    padding: 22px;
    border-radius: 8px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.card p {
    font-size: 32px;
    font-weight: bold;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

textarea {
    min-height: 80px;
}

#statusFilter {
    max-width: 250px;
}

#message {
    font-weight: bold;
}

@media (max-width: 700px) {
    .dashboard {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>Divinenet AI Marketing CRM</h1>
    <p>Phase 2 - Sprint 1 Campaign Management Prototype</p>
</header>

<nav>
    <button onclick="showDashboard()">Dashboard</button>
    <button onclick="showCampaigns()">Campaigns</button>
    <button onclick="showCreateForm()">Create Campaign</button>
</nav>

<main>

<section id="dashboardSection">
    <h2>Dashboard</h2>

    <div class="dashboard">

        <div class="card">
            <h3>Total Campaigns</h3>
            <p id="totalCampaigns">2</p>
        </div>

        <div class="card">
            <h3>Active Campaigns</h3>
            <p id="activeCampaigns">1</p>
        </div>

        <div class="card">
            <h3>Draft Campaigns</h3>
            <p id="draftCampaigns">1</p>
        </div>

    </div>
</section>

<section id="campaignSection" class="hidden">

    <h2>Campaigns</h2>

    <label>Filter by Status</label>

    <select id="statusFilter" onchange="renderCampaigns()">
        <option value="All">All</option>
        <option value="Draft">Draft</option>
        <option value="Active">Active</option>
        <option value="Paused">Paused</option>
        <option value="Completed">Completed</option>
    </select>

    <br><br>

    <div id="campaignList"></div>

</section>

<section id="formSection" class="hidden">

    <h2 id="formTitle">Create Campaign</h2>

    <form onsubmit="saveCampaign(event)">

        <input type="hidden" id="campaignId">

        <label>Campaign Name</label>
        <input id="campaignName" type="text">

        <label>Client</label>
        <input id="client" type="text">

        <label>Brand</label>
        <input id="brand" type="text">

        <label>Objective</label>
        <textarea id="objective"></textarea>

        <label>Target Audience</label>
        <input id="targetAudience" type="text">

        <label>Start Date</label>
        <input id="startDate" type="date">

        <label>End Date</label>
        <input id="endDate" type="date">

        <label>Budget</label>
        <input id="budget" type="number" min="0">

        <label>Marketing Channel</label>
        <select id="channel">
            <option value="">Select Channel</option>
            <option value="Facebook">Facebook</option>
            <option value="Instagram">Instagram</option>
            <option value="YouTube">YouTube</option>
            <option value="TikTok">TikTok</option>
        </select>

        <label>Status</label>
        <select id="status">
            <option value="Draft">Draft</option>
            <option value="Active">Active</option>
            <option value="Paused">Paused</option>
            <option value="Completed">Completed</option>
        </select>

        <p id="message"></p>

        <button type="submit">Save Campaign</button>
        <button type="button" onclick="showCampaigns()">Cancel</button>

    </form>

</section>

<section id="detailsSection" class="hidden">

    <h2>Campaign Details</h2>

    <div id="campaignDetails" class="details-box"></div>

    <button onclick="showCampaigns()">Back to Campaigns</button>

</section>

</main>

<script>

const STORAGE_KEY = "divinenetSprint1CampaignsV3";

const sampleCampaigns = [
    {
        id: 1,
        campaignName: "Winter Menu Promotion",
        client: "ABC Restaurant",
        brand: "ABC Restaurant",
        objective: "Promote the winter menu",
        targetAudience: "Melbourne customers aged 18-35",
        startDate: "2026-08-01",
        endDate: "2026-08-31",
        budget: 5000,
        channel: "Instagram",
        status: "Draft"
    },
    {
        id: 2,
        campaignName: "Spring Awareness Campaign",
        client: "XYZ Clothing",
        brand: "XYZ",
        objective: "Increase brand awareness",
        targetAudience: "Australian customers aged 18-30",
        startDate: "2026-09-01",
        endDate: "2026-09-30",
        budget: 7500,
        channel: "Facebook",
        status: "Active"
    }
];

let savedData = localStorage.getItem(STORAGE_KEY);
let campaigns;

if (savedData) {
    try {
        campaigns = JSON.parse(savedData);
    } catch {
        campaigns = [...sampleCampaigns];
    }
} else {
    campaigns = [...sampleCampaigns];
}

if (!Array.isArray(campaigns) || campaigns.length === 0) {
    campaigns = [...sampleCampaigns];
}

saveToStorage();

function saveToStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(campaigns));
}

function hideAll() {
    document.getElementById("dashboardSection").classList.add("hidden");
    document.getElementById("campaignSection").classList.add("hidden");
    document.getElementById("formSection").classList.add("hidden");
    document.getElementById("detailsSection").classList.add("hidden");
}

function updateDashboard() {
    document.getElementById("totalCampaigns").textContent =
        campaigns.length;

    document.getElementById("activeCampaigns").textContent =
        campaigns.filter(c => c.status === "Active").length;

    document.getElementById("draftCampaigns").textContent =
        campaigns.filter(c => c.status === "Draft").length;
}

function showDashboard() {
    hideAll();
    updateDashboard();
    document.getElementById("dashboardSection").classList.remove("hidden");
}

function showCampaigns() {
    hideAll();
    renderCampaigns();
    document.getElementById("campaignSection").classList.remove("hidden");
}

function showCreateForm() {
    hideAll();

    document.querySelector("form").reset();

    document.getElementById("campaignId").value = "";
    document.getElementById("formTitle").textContent = "Create Campaign";
    document.getElementById("message").textContent = "";

    document.getElementById("formSection").classList.remove("hidden");
}

function renderCampaigns() {

    const list = document.getElementById("campaignList");
    const filter = document.getElementById("statusFilter").value;

    list.innerHTML = "";

    const results =
        filter === "All"
            ? campaigns
            : campaigns.filter(c => c.status === filter);

    if (results.length === 0) {
        list.innerHTML = "<p>No campaigns found.</p>";
        return;
    }

    results.forEach(campaign => {

        const card = document.createElement("div");
        card.className = "campaign-card";

        card.innerHTML = `
            <h3>${campaign.campaignName}</h3>
            <p><strong>Client:</strong> ${campaign.client}</p>
            <p><strong>Channel:</strong> ${campaign.channel}</p>
            <p><strong>Status:</strong> ${campaign.status}</p>

            <button onclick="viewCampaign(${campaign.id})">View</button>
            <button onclick="editCampaign(${campaign.id})">Edit</button>
            <button onclick="deleteCampaign(${campaign.id})">Delete</button>
        `;

        list.appendChild(card);
    });
}

function saveCampaign(event) {

    event.preventDefault();

    const campaignName =
        document.getElementById("campaignName").value.trim();

    const client =
        document.getElementById("client").value.trim();

    const brand =
        document.getElementById("brand").value.trim();

    const objective =
        document.getElementById("objective").value.trim();

    const targetAudience =
        document.getElementById("targetAudience").value.trim();

    const startDate =
        document.getElementById("startDate").value;

    const endDate =
        document.getElementById("endDate").value;

    const budget =
        document.getElementById("budget").value;

    const channel =
        document.getElementById("channel").value;

    const status =
        document.getElementById("status").value;

    const message =
        document.getElementById("message");

    if (
        !campaignName ||
        !client ||
        !brand ||
        !objective ||
        !targetAudience ||
        !startDate ||
        !endDate ||
        !budget ||
        !channel
    ) {
        message.textContent = "Please complete all required fields.";
        return;
    }

    if (endDate < startDate) {
        message.textContent =
            "End date cannot be before the start date.";
        return;
    }

    const existingId =
        document.getElementById("campaignId").value;

    const campaign = {
        id: existingId ? Number(existingId) : Date.now(),
        campaignName,
        client,
        brand,
        objective,
        targetAudience,
        startDate,
        endDate,
        budget: Number(budget),
        channel,
        status
    };

    if (existingId) {

        const index =
            campaigns.findIndex(c => c.id === Number(existingId));

        if (index !== -1) {
            campaigns[index] = campaign;
        }

    } else {

        campaigns.push(campaign);
    }

    saveToStorage();
    updateDashboard();
    showCampaigns();
}

function viewCampaign(id) {

    const campaign = campaigns.find(c => c.id === id);

    if (!campaign) return;

    hideAll();

    document.getElementById("campaignDetails").innerHTML = `
        <h3>${campaign.campaignName}</h3>

        <p><strong>Client:</strong> ${campaign.client}</p>
        <p><strong>Brand:</strong> ${campaign.brand}</p>
        <p><strong>Objective:</strong> ${campaign.objective}</p>
        <p><strong>Target Audience:</strong> ${campaign.targetAudience}</p>
        <p><strong>Start Date:</strong> ${campaign.startDate}</p>
        <p><strong>End Date:</strong> ${campaign.endDate}</p>
        <p><strong>Budget:</strong> $${campaign.budget}</p>
        <p><strong>Channel:</strong> ${campaign.channel}</p>
        <p><strong>Status:</strong> ${campaign.status}</p>
    `;

    document.getElementById("detailsSection").classList.remove("hidden");
}

function editCampaign(id) {

    const campaign = campaigns.find(c => c.id === id);

    if (!campaign) return;

    hideAll();

    document.getElementById("campaignId").value = campaign.id;
    document.getElementById("campaignName").value = campaign.campaignName;
    document.getElementById("client").value = campaign.client;
    document.getElementById("brand").value = campaign.brand;
    document.getElementById("objective").value = campaign.objective;
    document.getElementById("targetAudience").value = campaign.targetAudience;
    document.getElementById("startDate").value = campaign.startDate;
    document.getElementById("endDate").value = campaign.endDate;
    document.getElementById("budget").value = campaign.budget;
    document.getElementById("channel").value = campaign.channel;
    document.getElementById("status").value = campaign.status;

    document.getElementById("formTitle").textContent = "Edit Campaign";
    document.getElementById("message").textContent = "";

    document.getElementById("formSection").classList.remove("hidden");
}

function deleteCampaign(id) {

    const campaign = campaigns.find(c => c.id === id);

    if (!campaign) return;

    const confirmed =
        confirm(`Are you sure you want to delete "${campaign.campaignName}"?`);

    if (!confirmed) return;

    campaigns = campaigns.filter(c => c.id !== id);

    saveToStorage();
    updateDashboard();
    renderCampaigns();
}

updateDashboard();

</script>

</body>
</html>
