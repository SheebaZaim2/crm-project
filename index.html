<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Divinenet CRM - Sprint 1</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Divinenet AI Marketing CRM</h1>
    <p>Phase 2 - Sprint 1 Campaign Management Prototype</p>
    <div id="userBar" class="hidden">
        <span id="userInfo"></span>
        <button onclick="handleLogout()">Logout</button>
    </div>
</header>

<main>

<p id="apiStatus" class="api-status">Connecting to API...</p>

<section id="loginSection">
    <h2>Sign In</h2>
    <form onsubmit="handleLogin(event)">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="admin@divinenet.test" required>
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="admin123" required>
        <p id="loginMessage"></p>
        <button type="submit">Sign In</button>
    </form>
</section>

<nav id="appNav" class="hidden">
    <button onclick="showDashboard()">Dashboard</button>
    <button onclick="showCampaigns()">Campaigns</button>
    <button onclick="showCreateForm()">Create Campaign</button>
</nav>

<section id="dashboardSection" class="hidden">
    <h2>Dashboard</h2>

    <div class="dashboard">

        <div class="card">
            <h3>Total Campaigns</h3>
            <p id="totalCampaigns">2</p>
        </div>

        <div class="card">
            <h3>Active Campaigns</h3>
            <p id="activeCampaigns">1</p>
        </div>

        <div class="card">
            <h3>Draft Campaigns</h3>
            <p id="draftCampaigns">1</p>
        </div>

    </div>
</section>

<section id="campaignSection" class="hidden">

    <h2>Campaigns</h2>

    <label>Filter by Status</label>

    <select id="statusFilter" onchange="renderCampaigns()">
        <option value="All">All</option>
        <option value="Draft">Draft</option>
        <option value="Active">Active</option>
        <option value="Paused">Paused</option>
        <option value="Completed">Completed</option>
    </select>

    <br><br>

    <div id="campaignList"></div>

</section>

<section id="formSection" class="hidden">

    <h2 id="formTitle">Create Campaign</h2>

    <form id="campaignForm" onsubmit="saveCampaign(event)">

        <input type="hidden" id="campaignId">

        <label>Campaign Name</label>
        <input id="campaignName" type="text">

        <label>Client</label>
        <input id="client" type="text">

        <label>Brand</label>
        <input id="brand" type="text">

        <label>Objective</label>
        <textarea id="objective"></textarea>

        <label>Target Audience</label>
        <input id="targetAudience" type="text">

        <label>Start Date</label>
        <input id="startDate" type="date">

        <label>End Date</label>
        <input id="endDate" type="date">

        <label>Budget</label>
        <input id="budget" type="number" min="0">

        <label>Marketing Channel</label>
        <select id="channel">
            <option value="">Select Channel</option>
            <option>Facebook</option>
            <option>Instagram</option>
            <option>YouTube</option>
            <option>TikTok</option>
        </select>

        <label>Status</label>
        <select id="status">
            <option>Draft</option>
            <option>Active</option>
            <option>Paused</option>
            <option>Completed</option>
        </select>

        <p id="message"></p>

        <button type="submit">Save Campaign</button>
        <button type="button" onclick="showCampaigns()">Cancel</button>

    </form>

</section>

<section id="detailsSection" class="hidden">

    <h2>Campaign Details</h2>

    <div id="campaignDetails" class="details-box"></div>

    <button onclick="showCampaigns()">Back to Campaigns</button>

</section>

</main>

<script src="js/api.js"></script>
<script src="apps.js"></script>

</body>
</html>
