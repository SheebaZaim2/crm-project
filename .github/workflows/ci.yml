name: CI

on:
  push:
    branches: [sprint2/backend-api]
  pull_request:
    branches: [sprint2/backend-api]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
        working-directory: backend
      - name: Run tests
        run: npm test -- --ci
        working-directory: backend
        env:
          AI_MOCK: "1"
          SOCIAL_MOCK: "1"
          PHASE1_MOCK: "1"